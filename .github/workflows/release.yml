name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.19.4"
            forge: "45.0.49"
            fg: "5.+"
            src: "v1.19.4"
            java: 17
            gradle: "7.6.4"
          - mc: "1.20.1"
            forge: "47.3.0"
            fg: "6.+"
            src: "v1.20.1"
            java: 17
            gradle: "8.10"
          - mc: "1.20.4"
            forge: "49.0.50"
            fg: "6.+"
            src: "v1.20.4"
            java: 17
            gradle: "8.10"
          - mc: "1.21"
            forge: "51.0.33"
            fg: "6.+"
            src: "v1.21"
            java: 21
            gradle: "8.10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Set Gradle wrapper to ${{ matrix.gradle }}
        run: |
          sed -i "s/gradle-[0-9.]*-bin.zip/gradle-${{ matrix.gradle }}-bin.zip/" gradle/wrapper/gradle-wrapper.properties

      - name: Build mc${{ matrix.mc }}
        run: >
          ./gradlew build --no-daemon
          -PminecraftVersion=${{ matrix.mc }}
          -PforgeVersion=${{ matrix.forge }}
          -PforgeGradleVersion=${{ matrix.fg }}
          -PversionSourceDir=${{ matrix.src }}
          -PjavaVersion=${{ matrix.java }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mc${{ matrix.mc }}
          path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "JARs generados automáticamente." \
            artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
