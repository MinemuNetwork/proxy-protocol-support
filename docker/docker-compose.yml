services:
  forge:
    image: itzg/minecraft-server:java17
    container_name: forge-test
    environment:
      EULA: "TRUE"
      TYPE: FORGE
      VERSION: "1.19.4"
      FORGE_VERSION: "45.0.49"
      MEMORY: "4G"
    volumes:
      - ./forge:/data
    networks:
      proxy-net:
        ipv4_address: 172.25.0.20

  proxy:
    image: haproxy:latest
    container_name: haproxy-test
    ports:
      - "25565:25565"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      proxy-net:
        ipv4_address: 172.25.0.10
    depends_on:
      - forge

networks:
  proxy-net:
    ipam:
      config:
        - subnet: 172.25.0.0/16
