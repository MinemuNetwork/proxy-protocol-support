buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath "net.minecraftforge.gradle:ForgeGradle:${forgeGradleVersion}"
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '7.+'
    id 'java'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = "1.1.0-forge-mc${minecraftVersion}"

sourceSets {
    main {
        java {
            srcDir "src/${versionSourceDir}/java"
        }
        resources {
            srcDir "src/${versionSourceDir}/resources"
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion as int)
}

configurations {
    shade
    implementation.extendsFrom shade
}

minecraft {
    mappings channel: 'official', version: minecraftVersion

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'proxy_protocol_support'

            mods {
                proxy_protocol_support {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'proxy_protocol_support'

            mods {
                proxy_protocol_support {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', 'proxy_protocol_support'

            mods {
                proxy_protocol_support {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            args '--mod', 'proxy_protocol_support', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                proxy_protocol_support {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "proxy_protocol_support.refmap.json"

    config "proxy_protocol_support.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"

    implementation("io.netty:netty-codec-haproxy:${nettyHaproxyVersion}")
    shade("io.netty:netty-codec-haproxy:${nettyHaproxyVersion}") {
        exclude group: '*', module: '*'
    }

    annotationProcessor "org.spongepowered:mixin:${mixinVersion}:processor"
}

jar {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                "Specification-Title"     : "proxy_protocol_support",
                "Specification-Vendor"    : "PanSzelescik",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "PanSzelescik",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]

    from("${buildDir}/tmp/compileJava") {
        include "*.refmap.json"
    }
}

assemble.dependsOn shadowJar

afterEvaluate {
    if (tasks.findByName('reobfJar') != null) {
        jar.finalizedBy('reobfJar')
    }
    if (tasks.findByName('reobfShadowJar') != null) {
        shadowJar.finalizedBy('reobfShadowJar')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
